[package]
name = "omnix-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "omnix_ui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
omnix-core = { path = "../../crates/omnix-core" }
omnix-protocol = { path = "../../crates/omnix-protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
