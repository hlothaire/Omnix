[package]
name = "omnix-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
omnix-protocol = { path = "../omnix-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
