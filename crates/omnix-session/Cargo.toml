[package]
name = "omnix-session"
version = "0.1.0"
edition = "2024"

[dependencies]
omnix-protocol = { path = "../omnix-protocol" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
