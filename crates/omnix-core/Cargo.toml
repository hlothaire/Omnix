[package]
name = "omnix-core"
version = "0.1.0"
edition = "2024"

[dependencies]
omnix-protocol = { path = "../omnix-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "1"

dirs = "6"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
