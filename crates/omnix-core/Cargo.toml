[package]
name = "omnix-core"
version = "0.1.0"
edition = "2024"

[dependencies]
omnix-protocol = { path = "../omnix-protocol" }
omnix-provider = { path = "../omnix-provider" }
omnix-session = { path = "../omnix-session" }
omnix-tools = { path = "../omnix-tools" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

anyhow = "1"

dirs = "6"

[dev-dependencies]
tempfile = "3"
