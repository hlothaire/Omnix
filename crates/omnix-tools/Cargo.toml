[package]
name = "omnix-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
omnix-protocol = { path = "../omnix-protocol" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
anyhow = "1"
thiserror = "1"
glob = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
